server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep Service Worker and HTML uncached so mobile PWA updates apply immediately.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Hashed Vite build assets can be cached permanently.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Audio files: disable gzip and preserve byte-range streaming for iOS/Android scrubbing.
    location /audio/ {
        gzip off;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
